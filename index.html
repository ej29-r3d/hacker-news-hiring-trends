<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>'Who wants to be hired' now outnumbers 'Who is hiring'</title>
<meta name="description" content="For the first time since 2014, job-seeker comments on Hacker News exceed hiring comments. Eight years of thread data, annotated.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #fff;
    color: #1a1a1a;
    line-height: 1.55;
  }
  .page { max-width: 1080px; margin: 0 auto; padding: 48px 20px 64px; }

  /* The article body is rendered from article.md — styling is positional:
     h1, then deck (first paragraph), then byline (second paragraph);
     everything after the --- rule is the footer. */
  .page h1 {
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.15;
    max-width: 800px;
    margin: 0 auto 14px;
  }
  .page p {
    font-size: 16px;
    max-width: 800px;
    margin: 0 auto 18px;
  }
  .page h1 + p {           /* deck */
    color: #555;
    margin-bottom: 10px;
  }
  .page h1 + p + p {       /* byline */
    font-size: 13px;
    color: #999;
    margin-bottom: 36px;
  }
  .page h1 + p + p a { color: #999; }
  .page a {
    color: #0D7680;
    text-decoration: none;
    border-bottom: 1px solid rgba(13,118,128,0.35);
  }
  .page figure { margin: 36px 0 44px; }
  .page iframe { width: 100%; border: none; display: block; }
  .page hr {
    max-width: 800px;
    margin: 24px auto 12px;
    border: none;
    border-top: 1px solid #e5e5e5;
  }
  .page hr ~ p {           /* footer */
    font-size: 13px;
    color: #777;
  }
</style>
</head>
<body>
<div class="page" id="content"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// Render article.md. Chart placeholders in the markdown look like:
//   {{chart hiring-chart.html?embed=1&title=hide 640}}
// and become auto-resizing iframes.
(async function() {
  var el = document.getElementById("content");
  var md;
  try {
    var res = await fetch("article.md");
    if (!res.ok) throw new Error(res.status);
    md = await res.text();
  } catch (e) {
    el.innerHTML = "<p>Couldn&rsquo;t load <code>article.md</code>. Open this page over HTTP " +
      "(e.g. <code>python3 -m http.server</code>), not file://.</p>";
    return;
  }
  md = md.replace(/^\{\{chart ([^\s}]+) (\d+)\}\}$/gm, function(m, src, h) {
    return '<figure><iframe src="' + src + '" data-chart="' + src.split("?")[0] +
           '" height="' + h + '"></iframe></figure>';
  });
  el.innerHTML = marked.parse(md);
})();

// Auto-size chart iframes: each embedded chart posts
// { type: "chart-resize", height, href } on load and resize.
window.addEventListener("message", function(e) {
  if (!e.data || e.data.type !== "chart-resize" || !e.data.href) return;
  var path = e.data.href.split("?")[0];
  document.querySelectorAll("iframe[data-chart]").forEach(function(f) {
    if (path.endsWith("/" + f.getAttribute("data-chart"))) {
      f.style.height = e.data.height + "px";
    }
  });
});
</script>
</body>
</html>
